<svg width="100%" viewBox="0 0 780 1230" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Scope 1: Platform Image Integrity — from build trigger through digest-bound signing to continuous verification</title>
  <desc>A build trigger (Renovate MR, commit, or manual) starts the pipeline. Each platform image is built, signed against cosign.pub, and its SBOM and provenance are attached as OCI referrers. An artifact-lock is pushed as a separate signed OCI artifact to the registry — co-located with the image, addressed by tag, not attached as a referrer. Every pipeline stage and external governance tool re-verifies the signature using the digest. Without the signature, attestations could be forged against the correct digest.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#a32d2d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; }
      .th { font-size: 13px; font-weight: 600; }
      .ts { font-size: 11px; font-weight: 400; }
      .tl { font-size: 10px; font-weight: 400; fill: #888; }
      .tj { font-size: 11px; font-weight: 400; }
      .tm { font-size: 10px; font-weight: 600; }
    </style>
  </defs>
  <rect width="680" height="1080" fill="#fafaf8"/>

  <!-- ═══ TRIGGER — causal entry point ═══ -->
  <rect x="240" y="24" width="300" height="68" rx="10" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
  <text class="th" x="390" y="42" text-anchor="middle" dominant-baseline="central" fill="#26215c">Build Trigger</text>
  <text class="ts" x="390" y="60" text-anchor="middle" dominant-baseline="central" fill="#534ab7">Renovate MR · commit · manual</text>
  <text class="tl" x="390" y="78" text-anchor="middle" dominant-baseline="central">automated or human — pipeline runs from here</text>
  <line x1="390" y1="92" x2="390" y2="116" stroke="#534ab7" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- ═══ Pipeline resolves digests ═══ -->
  <rect x="40" y="116" width="700" height="40" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.5"/>
  <text class="ts" x="390" y="136" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a" font-weight="600">Pipeline builds Platform Image → pushes signed artifact-lock to OCI registry</text>
  <line x1="390" y1="156" x2="390" y2="180" stroke="#888780" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- ═══ artifact-lock callout with full JSON ═══ -->
  <rect x="40" y="180" width="700" height="292" rx="8" fill="#f6f4ec" stroke="#888780" stroke-width="0.6"/>
  <text class="th" x="130" y="198" dominant-baseline="central" fill="#2c2c2a">artifact-lock — per platform · OCI artifact · tag-addressed · signed</text>
  <text class="ts" x="130" y="214" dominant-baseline="central" fill="#5f5e5a">tag: &lt;image&gt;:lock-&lt;build-tag&gt;-&lt;commit-sha&gt;-&lt;platform&gt;</text>
  <text class="tl" x="130" y="228" dominant-baseline="central" fill="#888">artifact-type: application/vnd.cibuild.artifact-lock+json</text>
  <text class="tj" x="130" y="248" dominant-baseline="central" fill="#3b6d11">{</text>
  <text class="tj" x="150" y="266" dominant-baseline="central" fill="#5f5e5a">"platform":      "linux/amd64",</text>
  <text class="tj" x="150" y="284" dominant-baseline="central" fill="#5f5e5a">"platform_name": "linux-amd64",</text>
  <text class="tj" x="150" y="302" dominant-baseline="central" fill="#5f5e5a">"image":         "registry.example.com/myorg/myapp",</text>
  <text class="tj" x="150" y="320" dominant-baseline="central" fill="#5f5e5a">"build_tag":     "main",</text>
  <text class="tj" x="150" y="338" dominant-baseline="central" fill="#5f5e5a">"image_digest":  "sha256:a1b2c3…",</text>
  <text class="tj" x="150" y="356" dominant-baseline="central" fill="#085041">"referrers": {</text>
  <text class="tj" x="170" y="374" dominant-baseline="central" fill="#085041">"sbom":       "sha256:def456…",</text>
  <text class="tj" x="170" y="392" dominant-baseline="central" fill="#085041">"vuln":       "sha256:ghi789…",</text>
  <text class="tj" x="170" y="410" dominant-baseline="central" fill="#085041">"provenance": "sha256:jkl012…"</text>
  <text class="tj" x="150" y="428" dominant-baseline="central" fill="#085041">},</text>
  <text class="tj" x="150" y="446" dominant-baseline="central" fill="#5f5e5a">"source_commit": "a1b2c3d4…"</text>
  <text class="tj" x="130" y="456" dominant-baseline="central" fill="#3b6d11">}</text>
  <line x1="390" y1="480" x2="390" y2="510" stroke="#888780" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- ═══ SCOPE 1 SIGNATURE — the security core ═══ -->
  <rect x="190" y="520" width="400" height="100" rx="10" fill="#085041" stroke="#0f6e56" stroke-width="1.2"/>
  <text class="th" x="390" y="548" text-anchor="middle" dominant-baseline="central" fill="#e1f5ee" style="font-size:14px">Scope 1 Signature — the security core</text>
  <text class="ts" x="390" y="566" text-anchor="middle" dominant-baseline="central" fill="#9fe1cb">Platform Image digests signed against cosign.pub</text>
  <text class="tl" x="390" y="580" text-anchor="middle" dominant-baseline="central" fill="#5dcaa5">binds digest ↔ signature · only digests consumed, never tags</text>
  <text class="tl" x="390" y="594" text-anchor="middle" dominant-baseline="central" fill="#5dcaa5">signed meta carries image.revision → VCS revision (self-attested)</text>

  <!-- ═══ Continuous verification ═══ -->
  <text class="tm" x="116" y="632" text-anchor="middle" dominant-baseline="central" fill="#534ab7">Pipeline — every stage re-verifies</text>

  <rect x="28" y="650" width="176" height="52" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text class="th" x="116" y="670" text-anchor="middle" dominant-baseline="central" fill="#26215c">Build stage</text>
  <text class="ts" x="116" y="686" text-anchor="middle" dominant-baseline="central" fill="#534ab7">signs digests</text>
  <line x1="116" y1="702" x2="116" y2="726" stroke="#534ab7" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>

  <rect x="28" y="726" width="176" height="52" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/>
  <text class="th" x="116" y="746" text-anchor="middle" dominant-baseline="central" fill="#26215c">Test stage</text>
  <text class="ts" x="116" y="762" text-anchor="middle" dominant-baseline="central" fill="#534ab7">verifies sig + digest</text>
  <line x1="116" y1="778" x2="116" y2="802" stroke="#534ab7" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>

  <rect x="28" y="802" width="176" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/>
  <text class="th" x="116" y="822" text-anchor="middle" dominant-baseline="central" fill="#26215c">Release stage</text>
  <text class="ts" x="116" y="840" text-anchor="middle" dominant-baseline="central" fill="#534ab7">verifies sig + digest</text>
  <text class="tl" x="116" y="870" text-anchor="middle" dominant-baseline="central">no stage inherits trust — each checks itself</text>

  <!-- Governance -->
  <text class="tm" x="648" y="632" text-anchor="middle" dominant-baseline="central" fill="#854f0b">Governance — independent gate</text>

  <rect x="552" y="650" width="188" height="80" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.8"/>
  <text class="th" x="648" y="670" text-anchor="middle" dominant-baseline="central" fill="#412402">DevGuard</text>
  <text class="ts" x="648" y="690" text-anchor="middle" dominant-baseline="central" fill="#854f0b">verifies before release</text>
  <text class="tl" x="648" y="710" text-anchor="middle" dominant-baseline="central">gates on integrity check</text>

  <rect x="552" y="750" width="188" height="70" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="th" x="648" y="770" text-anchor="middle" dominant-baseline="central" fill="#412402">Any compliance tool</text>
  <text class="ts" x="648" y="788" text-anchor="middle" dominant-baseline="central" fill="#854f0b">cosign verify --key</text>
  <text class="tl" x="648" y="806" text-anchor="middle" dominant-baseline="central">by digest — anytime, anywhere</text>

  <!-- Arrows from signature to verifiers -->
  <path d="M250 570 Q116 620 116 650" fill="none" stroke="#0f6e56" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M530 570 Q648 620 648 650" fill="none" stroke="#0f6e56" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- ═══ Threat model ═══ -->
  <rect x="28" y="910" width="724" height="130" rx="10" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.8"/>
  <text class="tm" x="390" y="932" text-anchor="middle" dominant-baseline="central" fill="#501313" style="font-size:11px">Why the signature is non-negotiable</text>
  <text class="tl" x="390" y="954" text-anchor="middle" dominant-baseline="central" fill="#7a2020">Since only digests are consumed (never tags), the image itself cannot be swapped.</text>
  <text class="tl" x="390" y="970" text-anchor="middle" dominant-baseline="central" fill="#7a2020">The remaining risk: forging an attestation against the correct digest.</text>

  <rect x="120" y="984" width="200" height="40" rx="8" fill="#f7c1c1" stroke="#a32d2d" stroke-width="0.5"/>
  <text class="th" x="220" y="1000" text-anchor="middle" dominant-baseline="central" fill="#501313">Attacker</text>
  <text class="ts" x="220" y="1016" text-anchor="middle" dominant-baseline="central" fill="#a32d2d">attaches forged SBOM</text>

  <rect x="380" y="984" width="300" height="40" rx="8" fill="#f7c1c1" stroke="#a32d2d" stroke-width="0.5"/>
  <text class="th" x="530" y="1000" text-anchor="middle" dominant-baseline="central" fill="#501313">Fake attestation accepted</text>
  <text class="ts" x="530" y="1016" text-anchor="middle" dominant-baseline="central" fill="#a32d2d">…unless a signature must verify first</text>

  <line x1="320" y1="1000" x2="380" y2="1000" stroke="#a32d2d" stroke-width="1" fill="none" marker-end="url(#arrow-red)"/>

  <!-- Legend -->
  <line x1="44" y1="1074" x2="76" y2="1074" stroke="#0f6e56" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="tl" x="84" y="1078" dominant-baseline="central">signature verified by stage / tool</text>
  <line x1="300" y1="1074" x2="332" y2="1074" stroke="#888780" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <text class="tl" x="390" y="1078" dominant-baseline="central">pipeline flow</text>
  <line x1="470" y1="1074" x2="502" y2="1074" stroke="#a32d2d" stroke-width="1" fill="none" marker-end="url(#arrow-red)"/>
  <text class="tl" x="510" y="1078" dominant-baseline="central">attack path (without signature)</text>

  <!-- Continues to Scope 2 -->
  <rect x="270" y="1110" width="240" height="52" rx="10" fill="#eaf3de" stroke="#3b6d11" stroke-width="1"/>
  <text class="th" x="390" y="1128" text-anchor="middle" dominant-baseline="central" fill="#173404">→ Scope 2: Release</text>
  <text class="ts" x="390" y="1146" text-anchor="middle" dominant-baseline="central" fill="#3b6d11">tag created here for the first time</text>
  <line x1="116" y1="858" x2="340" y2="1110" stroke="#534ab7" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <line x1="648" y1="810" x2="450" y2="1110" stroke="#854f0b" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
</svg>
