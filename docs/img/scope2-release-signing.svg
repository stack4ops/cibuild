<svg width="100%" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Scope 2: Multi-Arch Release Image as pure OCI manifest referencing already-signed Platform Images by digest</title>
  <desc>The release image is not a new build artifact. It is an OCI index manifest that references the existing signed Platform Images by digest. SBOM and Provenance are attached to the Platform Images at build time via the OCI Referrers API — not at release. The release manifest inherits them through the OCI reference chain.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; }
      .th { font-size: 13px; font-weight: 600; }
      .ts { font-size: 11px; font-weight: 400; }
      .tl { font-size: 10px; font-weight: 400; fill: #888; }
    </style>
  </defs>

  <rect width="680" height="560" fill="#fafaf8"/>

  <!-- All Scope 1 passed -->
  <rect x="160" y="20" width="360" height="40" rx="8" fill="#eaf3de" stroke="#3b6d11" stroke-width="0.8"/>
  <text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central" fill="#173404">All Scope 1 verifications passed ✓</text>
  <line x1="340" y1="60" x2="340" y2="84" stroke="#3b6d11" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Multi-Arch Release Manifest -->
  <rect x="140" y="84" width="400" height="80" rx="10" fill="#412402" stroke="#854f0b" stroke-width="1"/>
  <text class="th" x="340" y="106" text-anchor="middle" dominant-baseline="central" fill="#faeeda">Multi-Arch Release Manifest</text>
  <text class="ts" x="340" y="124" text-anchor="middle" dominant-baseline="central" fill="#f0997b">registry/…:web-workflow</text>
  <text class="tl" x="340" y="142" text-anchor="middle" dominant-baseline="central" fill="#ba7517">OCI index — no new layers · pure digest references · tag created here</text>
  <text class="tl" x="340" y="156" text-anchor="middle" dominant-baseline="central" fill="#ba7517">signed with Build Trigger Commit (keyless or key-mode)</text>

  <!-- OCI annotation -->
  <rect x="20" y="96" width="108" height="40" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="74" y="112" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a" style="font-size:10px">OCI Annotation</text>
  <text class="tl" x="74" y="126" text-anchor="middle" dominant-baseline="central">image.revision:</text>
  <line x1="128" y1="116" x2="140" y2="116" stroke="#888780" stroke-width="0.7" fill="none" marker-end="url(#arrow)"/>

  <!-- OCI Registry container -->
  <rect x="28" y="210" width="624" height="240" rx="12" fill="none" stroke="#b4b2a9" stroke-width="0.8" stroke-dasharray="6 4"/>
  <text class="tl" x="44" y="228" dominant-baseline="central" font-weight="600" fill="#5f5e5a">OCI Registry — pure manifest references, no data copied</text>

  <!-- Platform Image amd64 -->
  <rect x="120" y="244" width="180" height="148" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
  <text class="th" x="210" y="264" text-anchor="middle" dominant-baseline="central" fill="#085041">Platform Image</text>
  <text class="ts" x="210" y="282" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">linux/amd64</text>
  <text class="tl" x="210" y="298" text-anchor="middle" dominant-baseline="central">sha256:a1b2…</text>
  <rect x="132" y="308" width="156" height="28" rx="5" fill="#9fe1cb" stroke="#0f6e56" stroke-width="0.4"/>
  <text class="tl" x="210" y="322" text-anchor="middle" dominant-baseline="central" fill="#085041" font-weight="600">Scope 1 Signature</text>
  <rect x="132" y="342" width="72" height="26" rx="5" fill="#c0dd97" stroke="#3b6d11" stroke-width="0.4"/>
  <text class="tl" x="168" y="355" text-anchor="middle" dominant-baseline="central" fill="#173404">SBOM</text>
  <rect x="212" y="342" width="76" height="26" rx="5" fill="#c0dd97" stroke="#3b6d11" stroke-width="0.4"/>
  <text class="tl" x="250" y="355" text-anchor="middle" dominant-baseline="central" fill="#173404">Provenance</text>

  <!-- Platform Image arm64 -->
  <rect x="380" y="244" width="180" height="148" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
  <text class="th" x="470" y="264" text-anchor="middle" dominant-baseline="central" fill="#085041">Platform Image</text>
  <text class="ts" x="470" y="282" text-anchor="middle" dominant-baseline="central" fill="#0f6e56">linux/arm64</text>
  <text class="tl" x="470" y="298" text-anchor="middle" dominant-baseline="central">sha256:c3d4…</text>
  <rect x="392" y="308" width="156" height="28" rx="5" fill="#9fe1cb" stroke="#0f6e56" stroke-width="0.4"/>
  <text class="tl" x="470" y="322" text-anchor="middle" dominant-baseline="central" fill="#085041" font-weight="600">Scope 1 Signature</text>
  <rect x="392" y="342" width="72" height="26" rx="5" fill="#c0dd97" stroke="#3b6d11" stroke-width="0.4"/>
  <text class="tl" x="428" y="355" text-anchor="middle" dominant-baseline="central" fill="#173404">SBOM</text>
  <rect x="472" y="342" width="76" height="26" rx="5" fill="#c0dd97" stroke="#3b6d11" stroke-width="0.4"/>
  <text class="tl" x="510" y="355" text-anchor="middle" dominant-baseline="central" fill="#173404">Provenance</text>

  <!-- OCI referrers note -->
  <rect x="44" y="402" width="576" height="28" rx="6" fill="#eaf3de" stroke="#3b6d11" stroke-width="0.4"/>
  <text class="tl" x="332" y="416" text-anchor="middle" dominant-baseline="central" font-weight="600" fill="#173404">SBOM + Provenance attached at build time via OCI Referrers API — unchanged at release</text>

  <!-- OCI digest reference arrows -->
  <line x1="300" y1="164" x2="210" y2="244" stroke="#854f0b" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow)"/>
  <line x1="380" y1="164" x2="470" y2="244" stroke="#854f0b" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow)"/>
  <text class="tl" x="232" y="200" text-anchor="middle" dominant-baseline="central">ref@sha256:a1b2…</text>
  <text class="tl" x="448" y="200" text-anchor="middle" dominant-baseline="central">ref@sha256:c3d4…</text>

  <!-- Verification -->
  <rect x="160" y="458" width="360" height="52" rx="8" fill="#eaf3de" stroke="#3b6d11" stroke-width="0.8"/>
  <text class="th" x="340" y="476" text-anchor="middle" dominant-baseline="central" fill="#173404">cosign verify --key cosign.pub</text>
  <text class="ts" x="340" y="494" text-anchor="middle" dominant-baseline="central" fill="#3b6d11">registry/…:web-workflow  (resolves all platform refs)</text>
  <line x1="340" y1="430" x2="340" y2="458" stroke="#3b6d11" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line x1="44" y1="528" x2="76" y2="528" stroke="#854f0b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="tl" x="84" y="532" dominant-baseline="central">OCI digest reference (no data copy)</text>
  <rect x="280" y="522" width="12" height="12" rx="2" fill="#9fe1cb" stroke="#0f6e56" stroke-width="0.4"/>
  <text class="tl" x="298" y="530" dominant-baseline="central">Scope 1 Signature</text>
  <rect x="420" y="522" width="12" height="12" rx="2" fill="#c0dd97" stroke="#3b6d11" stroke-width="0.4"/>
  <text class="tl" x="438" y="530" dominant-baseline="central">SBOM / Provenance (build time, OCI referrers)</text>
</svg>
